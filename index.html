<script>
const SITE_DOMAIN = window.location.hostname;


const CATEGORY_ICONS = {
    '编码/解码': '🔧', '时间/日期': '⏰', '开发者工具': '💻', '视频/流媒体': '🎬',
    '生成器': '🎯', '设计工具': '🎨', '加密/哈希': '🔒', '网络工具': '🌐',
    '文本工具': '📝', '数学/计算': '🔢'
};

const CATEGORY_PALETTE = [
    { color: '#f59e0b', bg: '#fffbeb', border: '#fde68a' },
    { color: '#3b82f6', bg: '#eff6ff', border: '#bfdbfe' },
    { color: '#10b981', bg: '#ecfdf5', border: '#a7f3d0' },
    { color: '#ec4899', bg: '#fdf2f8', border: '#fbcfe8' },
    { color: '#6366f1', bg: '#eef2ff', border: '#c7d2fe' },
    { color: '#14b8a6', bg: '#f0fdfa', border: '#99f6e4' },
    { color: '#f97316', bg: '#fff7ed', border: '#fed7aa' },
    { color: '#06b6d4', bg: '#ecfeff', border: '#a5f3fc' },
    { color: '#8b5cf6', bg: '#f5f3ff', border: '#ddd6fe' },
    { color: '#ef4444', bg: '#fef2f2', border: '#fecaca' },
    { color: '#84cc16', bg: '#f7fee7', border: '#d9f99d' },
    { color: '#a855f7', bg: '#faf5ff', border: '#e9d5ff' }
];

let allTools = [];
let categoryMeta = {};
let currentCategory = '';

function buildCategoryMeta(tools) {
    var cats = [];
    var seen = {};
    tools.forEach(function(t) {
        if (!seen[t.category]) { seen[t.category] = true; cats.push(t.category); }
    });
    var meta = {};
    cats.forEach(function(cat, i) {
        var palette = CATEGORY_PALETTE[i % CATEGORY_PALETTE.length];
        meta[cat] = {
            icon: CATEGORY_ICONS[cat] || '🔧',
            color: palette.color,
            bg: palette.bg,
            border: palette.border
        };
    });
    return meta;
}

function updateSEO(tools) {
    var count = tools.length;
    var cats = [];
    var seen = {};
    tools.forEach(function(t) {
        if (!seen[t.category]) { seen[t.category] = true; cats.push(t.category); }
    });
    var domain = SITE_DOMAIN;
    var topTools = tools.slice(0, 3).map(function(t) { return t.name; }).join('、');
    var desc = 'ToolBox在线工具提供' + count + '+免费在线开发者工具：' + topTools + '等，纯前端实现，数据不上传服务器，打开即用。';
    var keywords = 'ToolBox在线工具,在线工具,' + cats.join(',') + ',免费在线工具,Web在线工具,纯前端工具';
    var title = 'ToolBox在线工具 - ' + topTools + '等' + count + '+免费工具';

    document.title = title;
    var el;
    el = document.getElementById('metaDesc'); if (el) el.content = desc;
    el = document.getElementById('metaKeywords'); if (el) el.content = keywords;
    el = document.getElementById('ogTitle'); if (el) el.content = title;
    el = document.getElementById('ogDesc'); if (el) el.content = desc;
    el = document.getElementById('ogUrl'); if (el) el.content = '/';
    el = document.getElementById('canonical'); if (el) el.href = '/';
    el = document.getElementById('hreflang'); if (el) el.href = '/';
    el = document.getElementById('twTitle'); if (el) el.content = title;
    el = document.getElementById('twDesc'); if (el) el.content = desc;

    var ld1 = document.getElementById('ldWebsite');
    if (ld1) {
        var d1 = JSON.parse(ld1.textContent);
        d1.url = window.location.origin + '/';
        d1.alternateName = domain;
        d1.description = desc;
        d1.potentialAction.target = window.location.origin + '/?q={search_term_string}';
        ld1.textContent = JSON.stringify(d1);
    }
    var ld2 = document.getElementById('ldSoftware');
    if (ld2) {
        var d2 = JSON.parse(ld2.textContent);
        d2.url = window.location.origin + '/';
        ld2.textContent = JSON.stringify(d2);
    }
}

function renderCategories() {
    var counts = {};
    allTools.forEach(function(t) { counts[t.category] = (counts[t.category] || 0) + 1; });
    var cats = Object.keys(categoryMeta);
    var tabsEl = document.getElementById('categoryTabs');
    
    var MAX_VISIBLE = 7;
    var hasMore = cats.length > MAX_VISIBLE;

    var html = '<button class="category-tab active" data-category=""><span class="tab-icon">📋</span>全部<span class="tab-count">' + allTools.length + '</span></button>';
    
    cats.forEach(function(cat, index) {
        var meta = categoryMeta[cat];
        var count = counts[cat] || 0;
        var isHidden = hasMore && index >= MAX_VISIBLE;
        html += '<button class="category-tab' + (isHidden ? ' hidden' : '') + '" data-category="' + cat + '" style="--cat-color:' + meta.color + ';--cat-bg:' + meta.bg + ';--cat-border:' + meta.border + '"><span class="tab-icon">' + meta.icon + '</span>' + cat + '<span class="tab-count">' + count + '</span></button>';
    });
    
    if (hasMore) {
        var hiddenCount = cats.length - MAX_VISIBLE;
        html += '<button class="category-toggle" id="categoryToggle"><span class="toggle-icon">▼</span>展开 ' + hiddenCount + ' 个分类</button>';
    }

    tabsEl.innerHTML = html;

    tabsEl.querySelectorAll('.category-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            currentCategory = this.dataset.category;
            tabsEl.querySelectorAll('.category-tab').forEach(function(t) { t.classList.remove('active'); });
            this.classList.add('active');
            renderTools();
        });
    });
    
    var toggleBtn = document.getElementById('categoryToggle');
    if (toggleBtn) {
        toggleBtn.addEventListener('click', function() {
            var isExpanded = this.classList.toggle('expanded');
            var hiddenTabs = tabsEl.querySelectorAll('.category-tab.hidden');
            
            if (isExpanded) {
                hiddenTabs.forEach(function(tab) { tab.classList.remove('hidden'); });
                this.innerHTML = '<span class="toggle-icon">▼</span>收起';
            } else {
                tabsEl.querySelectorAll('.category-tab').forEach(function(tab, index) {
                    if (index > MAX_VISIBLE) tab.classList.add('hidden');
                });
                var hiddenCount = cats.length - MAX_VISIBLE;
                this.innerHTML = '<span class="toggle-icon">▼</span>展开 ' + hiddenCount + ' 个分类';
            }
        });
    }
}

    var PAGE_SIZE = 8;
    var displayedCount = 0;
    var currentFiltered = [];

    function renderTools() {
        var grid = document.getElementById('toolsGrid');
        var titleEl = document.getElementById('sectionTitle');
        var countEl = document.getElementById('sectionCount');
        var searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

        var filtered = allTools;
        if (currentCategory) {
            filtered = filtered.filter(function(t) { return t.category === currentCategory; });
        }
        if (searchVal) {
            filtered = filtered.filter(function(t) {
                return t.name.toLowerCase().includes(searchVal) ||
                    t.description.toLowerCase().includes(searchVal) ||
                    t.category.toLowerCase().includes(searchVal) ||
                    (t.aliases && t.aliases.some(function(a) { return a.toLowerCase().includes(searchVal); }));
            });
        }

        titleEl.textContent = currentCategory || '全部工具';
        countEl.textContent = filtered.length + ' 个工具';

        if (filtered.length === 0) {
            grid.innerHTML = '<div class="no-results"><div class="no-results-icon">🔍</div><p>没有找到匹配的工具</p></div>';
            currentFiltered = [];
            displayedCount = 0;
            return;
        }

        currentFiltered = filtered;
        displayedCount = 0;
        grid.innerHTML = '';
        appendCards();
        checkFill();
    }

    function appendCards() {
        var grid = document.getElementById('toolsGrid');
        var end = Math.min(displayedCount + PAGE_SIZE, currentFiltered.length);
        var fragment = document.createDocumentFragment();

        for (var i = displayedCount; i < end; i++) {
            var tool = currentFiltered[i];
            var meta = categoryMeta[tool.category] || { icon: '🔧', color: '#2563eb', bg: '#eff6ff', border: '#bfdbfe' };
            var card = document.createElement('a');
            card.href = tool.path;
            card.className = 'tool-card';
            card.style.cssText = '--cat-color:' + meta.color + ';--cat-bg:' + meta.bg + ';--cat-border:' + meta.border;
            card.innerHTML = '<div class="tool-card-header">' +
                    '<div class="tool-icon" style="background:' + meta.bg + ';color:' + meta.color + '">' + meta.icon + '</div>' +
                    '<div class="tool-name">' + tool.name + '</div>' +
                '</div>' +
                '<div class="tool-desc">' + tool.description + '</div>' +
                '<span class="tool-tag" style="background:' + meta.bg + ';color:' + meta.color + ';border:1px solid ' + meta.border + '">' + tool.category + '</span>';
            fragment.appendChild(card);
        }

        var sentinel = grid.querySelector('.scroll-sentinel');
        if (sentinel) {
            scrollObserver.unobserve(sentinel);
            sentinel.remove();
        }

        grid.appendChild(fragment);

        var newCards = grid.querySelectorAll('.tool-card:not(.visible)');
        newCards.forEach(function(card, idx) {
            setTimeout(function() { card.classList.add('visible'); }, idx * 30);
        });

        displayedCount = end;

        if (displayedCount < currentFiltered.length) {
            var el = document.createElement('div');
            el.className = 'scroll-sentinel';
            el.style.cssText = 'height:1px;width:100%';
            grid.appendChild(el);
            scrollObserver.observe(el);
        }
    }

    var scrollObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting && displayedCount < currentFiltered.length) {
                scrollObserver.unobserve(entry.target);
                appendCards();
                checkFill();
            }
        });
    }, { rootMargin: '200px' });

    function checkFill() {
        if (displayedCount >= currentFiltered.length) return;
        var sentinel = document.querySelector('.scroll-sentinel');
        if (sentinel && sentinel.getBoundingClientRect().top < window.innerHeight + 200) {
            scrollObserver.unobserve(sentinel);
            sentinel.remove();
            appendCards();
            checkFill();
        }
    }

function loadRecentTools() {
    try {
        var history = JSON.parse(localStorage.getItem('tool_history') || '[]');
        var recentBar = document.getElementById('recentBar');
        var recentLinks = document.getElementById('recentLinks');

        if (history.length === 0) {
            recentBar.classList.remove('active');
            return;
        }

        var recent = history.slice(0, 8);
        recentLinks.innerHTML = recent.map(function(t) {
            return '<a href="' + t.path + '" class="recent-link">' + t.name + '</a>';
        }).join('');
        recentBar.classList.add('active');
    } catch(e) {}
}

function setupSearch() {
    var input = document.getElementById('searchInput');
    var clearBtn = document.getElementById('clearSearch');

    input.addEventListener('input', function() {
        clearBtn.style.display = this.value ? 'block' : 'none';
        renderTools();
    });

    clearBtn.addEventListener('click', function() {
        input.value = '';
        clearBtn.style.display = 'none';
        renderTools();
        input.focus();
    });

    var params = new URLSearchParams(window.location.search);
    var q = params.get('q');
    if (q) {
        input.value = q;
        clearBtn.style.display = 'block';
        renderTools();
    }
}

function resetAll() {
    currentCategory = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('clearSearch').style.display = 'none';

    var tabs = document.querySelectorAll('.category-tab');
    tabs.forEach(function(t) { t.classList.remove('active'); });
    if (tabs[0]) tabs[0].classList.add('active');

    renderTools();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function loadData() {
    try {
        var res = await fetch('search-index.json');
        if (res.ok) {
            var data = await res.json();
            if (Array.isArray(data) && data.length > 0) allTools = data;
        }
    } catch(e) {}
    categoryMeta = buildCategoryMeta(allTools);
}

async function init() {
    document.getElementById('year').textContent = new Date().getFullYear();
    await loadData();

    var cats = Object.keys(categoryMeta);
    document.getElementById('statTools').textContent = allTools.length;
    document.getElementById('statCats').textContent = cats.length;
    updateSEO(allTools);

    renderCategories();
    renderTools();
    loadRecentTools();
    setupSearch();
    ToolBoxTheme.setupToggle();

    window.addEventListener('scroll', function() {
        var header = document.querySelector('.header');
        header.classList.toggle('scrolled', window.scrollY > 10);
    });
}

init();
</script>

<script>
(function(){
    var cfg = { brand: 'ToolBox', icp: '豫ICP备17031913号-1', github: 'https://github.com/hw016494596/tools', githubLabel: 'GitHub', siteDesc: '纯前端实现，数据不上传服务器，隐私安全有保障' };
    if (window.location.protocol !== 'file:') {
        fetch('site-config.json').then(function(r) { return r.json(); }).then(function(c) {
            for (var k in c) cfg[k] = c[k];
            applyCfg(cfg);
        }).catch(function() { applyCfg(cfg); });
    } else { applyCfg(cfg); }
    function applyCfg(cfg) {
        document.querySelectorAll('[data-cfg]').forEach(function(el) {
            var key = el.getAttribute('data-cfg');
            if (cfg[key] !== undefined) el.textContent = cfg[key];
        });
        document.querySelectorAll('[data-cfg-href]').forEach(function(el) {
            var key = el.getAttribute('data-cfg-href');
            if (cfg[key] !== undefined) el.href = cfg[key];
        });
    }
})();
</script>
