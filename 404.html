<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - 404 | ToolBox在线工具</title>
    <meta name="description" content="您访问的页面不存在，请尝试搜索工具或返回在线工具首页。">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" id="canonical" href="404.html">
    <link rel="stylesheet" href="assets/css/global.css">
    <script src="assets/js/theme.js"></script>
    <style>
        .main { flex: 1; padding: 4rem 0; text-align: center; }
        
        .error-wrapper { animation: fadeInUp 0.5s ease; }
        .error-subtitle { font-size: 1.1rem; color: var(--text-secondary); margin: 0.5rem 0 2rem; }
        
        .search-box { max-width: 400px; margin: 0 auto 2.5rem; position: relative; }
        .search-box .search-input {
            width: 100%; padding: 0.75rem 1rem; border: 2px solid var(--border);
            border-radius: var(--radius-full); font-size: 0.95rem; outline: none;
            transition: var(--transition);
        }
        .search-box .search-input:focus { border-color: var(--primary); box-shadow: var(--search-shadow); }
        
        .popular-tools { max-width: 800px; margin: 0 auto; }
        .popular-tools h3 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--text-secondary); font-weight: 600; }
        .tools-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem;
        }
        .tools-grid .tool-card { animation: fadeInUp 0.3s ease forwards; }
        
        .back-home-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            margin-top: 2rem; padding: 0.75rem 1.5rem;
            background: var(--primary); color: var(--primary-contrast); border-radius: var(--radius-full);
            text-decoration: none; font-weight: 500; transition: var(--transition);
        }
        .back-home-btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        
        @media (max-width: 600px) {
            .main { padding: 3rem 0; }
            .error-code { font-size: 4rem; }
            .tools-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">ToolBox</a>
            <div class="header-spacer"></div>
            <div class="search-wrapper">
                <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="搜索工具..." autocomplete="off">
            </div>
            <div class="header-spacer"></div>
            <div class="header-actions">
                <a href="about.html" class="header-link">关于我们</a>
                <button class="theme-toggle" id="themeToggle" title="切换主题">
                    <svg class="theme-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>
    <main class="main container">
        <div class="error-wrapper">
            <div class="error-code">404</div>
            <p class="error-subtitle">抱歉，您访问的页面不存在</p>
            <a href="index.html" class="back-home-btn">← 返回首页</a>
            <div class="popular-tools" style="margin-top: 2.5rem;">
                <h3>🔥 热门工具</h3>
                <div class="tools-grid" id="toolsGrid"></div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <div class="footer-brand" data-cfg="brand">ToolBox</div>
                <div class="footer-desc" data-cfg="siteDesc">纯前端实现，数据不上传服务器，隐私安全有保障</div>
                <div class="footer-links">
                    <a href="index.html">首页</a>
                    <a href="about.html">关于我们</a>
                    <a href="privacy.html">隐私政策</a>
                    <a href="https://github.com/" target="_blank" rel="noopener" data-cfg-href="github" data-cfg="githubLabel">GitHub</a>
                </div>
                <div class="footer-bottom">
                    © <span id="year"></span> <span data-cfg="brand">ToolBox</span> ·
                    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" data-cfg="icp">豫ICP备17031913号-1</a>
                </div>
            </div>
        </div>
    </footer>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        var popularTools = [
            { name: "JSON 格式化", desc: "格式化、校验JSON", path: "tools/json-formatter.html" },
            { name: "MD5 加密", desc: "MD5哈希计算", path: "tools/md5.html" },
            { name: "随机密码生成", desc: "高强度随机密码", path: "tools/password.html" },
            { name: "图片压缩", desc: "浏览器端压缩图片", path: "tools/image-compress.html" },
            { name: "文本对比", desc: "对比文本差异", path: "tools/text-diff.html" },
            { name: "科学计算器", desc: "在线科学计算", path: "tools/calculator.html" }
        ];
        var grid = document.getElementById('toolsGrid');
        grid.innerHTML = popularTools.map(function(t) {
            return '<a href="' + t.path + '" class="tool-card"><div class="tool-name">' + t.name + '</div><div class="tool-desc">' + t.desc + '</div></a>';
        }).join('');
        document.getElementById('searchInput').addEventListener('input', function() {
            var q = this.value.toLowerCase().trim();
            if (!q) {
                grid.innerHTML = popularTools.map(function(t) {
                    return '<a href="' + t.path + '" class="tool-card"><div class="tool-name">' + t.name + '</div><div class="tool-desc">' + t.desc + '</div></a>';
                }).join('');
                return;
            }
            if (window.location.protocol === 'file:') return;
            fetch('search-index.json').then(function(r) { return r.json(); }).then(function(tools) {
                var results = tools.filter(function(t) {
                    return t.name.toLowerCase().includes(q) ||
                        t.description.toLowerCase().includes(q) ||
                        t.category.toLowerCase().includes(q) ||
                        (t.aliases && t.aliases.some(function(a) { return a.toLowerCase().includes(q); }));
                }).slice(0, 6);
                grid.innerHTML = results.length ? results.map(function(t) {
                    return '<a href="' + t.path + '" class="tool-card"><div class="tool-name">' + t.name + '</div><div class="tool-desc">' + t.description + '</div></a>';
                }).join('') : '<p style="grid-column:1/-1;color:var(--text-muted);">未找到匹配的工具</p>';
            }).catch(function() {});
        });
        var el = document.getElementById('canonical');
        if (el) el.href = '404.html';
    </script>
<script>ToolBoxTheme.setupToggle();</script>
<script>
(function(){
    var cfg = { brand: 'ToolBox', icp: '豫ICP备17031913号-1', github: 'https://github.com/hw016494596/tools', githubLabel: 'GitHub', siteDesc: '纯前端实现，数据不上传服务器，隐私安全有保障' };
    if (window.location.protocol !== 'file:') {
        fetch('site-config.json').then(function(r) { return r.json(); }).then(function(c) {
            for (var k in c) cfg[k] = c[k];
            applyCfg(cfg);
        }).catch(function() { applyCfg(cfg); });
    } else { applyCfg(cfg); }
    function applyCfg(cfg) {
        document.querySelectorAll('[data-cfg]').forEach(function(el) {
            var key = el.getAttribute('data-cfg');
            if (cfg[key] !== undefined) el.textContent = cfg[key];
        });
        document.querySelectorAll('[data-cfg-href]').forEach(function(el) {
            var key = el.getAttribute('data-cfg-href');
            if (cfg[key] !== undefined) el.href = cfg[key];
        });
    }
})();
</script>
</body>
</html>
